defaults:
  - dataset: small
  - model: lenet
  - train: default
  - _self_

seed: 0
eval_domains: [small, medium, big]

data:
  images_path: data/processed/normalized_64.npz
  meta_path: data/processed/normalized_64_meta.csv
  image_size: 64
  num_workers: 0

hydra:
  sweeper:
    params:
      dataset: small,medium,big
      seed: 0,1,2,3,4
  run:
    dir: outputs/src_${dataset.name}/seed${seed}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: src_${dataset.name}/seed${seed}