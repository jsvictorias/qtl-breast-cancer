defaults:
  - dataset: small
  - model: lenet
  - train: default
  - _self_

seed: 0
eval_domains: [small, medium, big]

data:
  manifest_path: data/processed/manifest.json
  image_size: 64
  num_workers: 2

hydra:
  run:
    dir: outputs/src_${dataset.name}/seed${seed}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: src_${dataset.name}/seed${seed}