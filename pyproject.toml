[project]
name = "qtl-breast-cancer"
version = "0.1.0"
description = "Quantum Transfer Learning for Breast Cancer UCG"
readme = "README.md"
authors = [{ name = "Júlia Santos", email = "juliasantos7652@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pre-commit>=4.6.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "tensorflow>=2.21.0",
    "torch>=2.12.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
]
[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]
ignore = ["E741", "N806"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
