defaults:
  - dataset: big
  - model: lenet
  - _self_

hydra:
  job:
    name: lenet_${dataset.name}_seed${training.seed}
  run:
    dir: ${output.base_dir}/single_seed${training.seed}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output.base_dir}/../multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${dataset.name}_seed${training.seed}